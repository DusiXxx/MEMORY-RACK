# Vydani MEMORY RACK: pri kazdem tagu v<verze> GitHub (Mac v cloudu) postavi univerzalni plugin, overi ho (auval),
# zabali, spocita SHA-256 a zverejni vydani s latest.json -> pluginy u lidi nabidnou aktualizaci.
# Kdyz build selze, nic se nezverejni; log se ulozi do NEzverejneneho konceptu vydani (draft) "ci-log-...".
name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Verze z tagu = verze v CMakeLists.txt
        run: |
          VER="${GITHUB_REF_NAME#v}"
          CM=$(sed -n 's/^project(RackMemory VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          echo "tag $VER, CMakeLists $CM"
          [ "$VER" = "$CM" ] || { echo "Tag a verze nesedi" | tee ci.log; exit 1; }
          echo "VER=$VER" >> "$GITHUB_ENV"
      - name: Build (Intel + Apple Silicon)
        run: |
          set -o pipefail
          cmake -S . -B build -G "Unix Makefiles" -DCMAKE_BUILD_TYPE=Release "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64" \
                -DRM_UPDATE_REPO="${GITHUB_REPOSITORY}" 2>&1 | tee -a ci.log
          cmake --build build --target RackMemory_AU -j 3 2>&1 | tail -n 400 | tee -a ci.log
      - name: Overeni (auval)
        run: |
          set -o pipefail
          COMP="$HOME/Library/Audio/Plug-Ins/Components/Rack Memory.component"
          [ -d "$COMP" ] || COMP="$(find build -type d -name 'Rack Memory.component' | head -n 1)"
          echo "COMP=$COMP" >> "$GITHUB_ENV"
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$COMP/Contents/Info.plist" | tee -a ci.log | grep -qx "$VER"
          lipo -archs "$COMP/Contents/MacOS/Rack Memory" | tee -a ci.log
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          sleep 2
          if auval -v aufx Rkmm Dusx > auval.log 2>&1 && grep -q "AU VALIDATION SUCCEEDED" auval.log; then echo "auval OK" | tee -a ci.log
          else tail -n 40 auval.log | tee -a ci.log; echo "::warning::auval na CI neprosel (na Macu ho overi instalator)"; fi
      - name: Balicek + latest.json
        run: |
          set -e
          OUT=out; mkdir -p $OUT; STAGE=$(mktemp -d)
          ASSET="RackMemory-$VER-mac.zip"
          ditto "$COMP" "$STAGE/Rack Memory.component"
          cp "JAK NAINSTALOVAT.txt" "$STAGE/" 2>/dev/null || true
          ditto -c -k --sequesterRsrc "$STAGE" "$OUT/$ASSET"
          unzip -l "$OUT/$ASSET" | grep -q "Rack Memory.component/Contents/MacOS/Rack Memory"
          SHA=$(shasum -a 256 "$OUT/$ASSET" | awk '{print $1}')
          SIZE=$(stat -f%z "$OUT/$ASSET")
          ARCHS=$(lipo -archs "$COMP/Contents/MacOS/Rack Memory")
          NOTES=$(sed -n '1,/^$/p' RELEASE_NOTES.md 2>/dev/null | head -n 20)
          [ -z "$NOTES" ] && NOTES="MEMORY RACK $VER"
          printf '%s\n' "$NOTES" > "$OUT/RELEASE_NOTES.md"
          python3 - "$OUT/latest.json" "$VER" "$SHA" "$SIZE" "$ARCHS" "$GITHUB_REPOSITORY" "$ASSET" "$OUT/RELEASE_NOTES.md" <<'PY'
          import json, sys
          out, ver, sha, size, archs, repo, asset, notes = sys.argv[1:9]
          json.dump({"version": ver, "channel": "stable",
                     "minimum_version": "0.12.0",
                     "notes": open(notes).read().strip(),
                     "notes_url": f"https://github.com/{repo}/releases/tag/v{ver}",
                     "download": f"https://github.com/{repo}/releases/download/v{ver}/{asset}",
                     "sha256": sha, "size": int(size), "architectures": archs.split(),
                     "formats": ["AU"], "macos_min": "10.13"}, open(out, "w"), indent=2)
          PY
          cat "$OUT/latest.json" | tee -a ci.log
      - name: Zverejneni
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "out/RackMemory-$VER-mac.zip" out/latest.json \
             --title "MEMORY RACK $VER" --notes-file out/RELEASE_NOTES.md --latest
      - name: Log pri chybe (koncept vydani, neverejny)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f ci.log ] || echo "bez logu" > ci.log
          gh release create "ci-log-${GITHUB_RUN_ID}" ci.log --draft --title "CI log ${GITHUB_REF_NAME} (chyba)" --notes "Build ${GITHUB_REF_NAME} selhal - log v priloze." || true
